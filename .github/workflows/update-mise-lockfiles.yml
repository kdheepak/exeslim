name: Update mise lockfiles

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-mise-lockfiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Read the image's mise version
        id: mise-version
        run: |
          version=$(awk -F '[:@]' '/^COPY --from=ghcr.io\/jdx\/mise:/ { print $2 }' Dockerfile)
          [[ "$version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Install mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: ${{ steps.mise-version.outputs.version }}
          install: false
          cache: false
          working_directory: vm
          github_token: ${{ github.token }}

      - name: Update VM lockfile
        working-directory: vm
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise lock --upgrade --bump --platform linux-x64

      - name: Validate locked tools
        working-directory: vm
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install --locked

      - name: Open grouped dependency pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ github.token }}
          base: main
          branch: automation/mise-lockfiles
          delete-branch: true
          draft: always-true
          commit-message: 'chore(deps): update mise lockfile'
          title: 'chore(deps): update mise lockfile'
          body: |
            Weekly grouped update of the VM tools for Linux x64.

            Generated with the image's mise version:
            `mise -C vm lock --upgrade --bump --platform linux-x64`.

            The locked tools were installed on Linux before this PR was opened.
            Mark this PR ready for review to run the image build.
            Later automated updates return the PR to draft.
          add-paths: vm/mise.lock
