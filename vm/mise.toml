[tools]
mr-boxington = "latest"
rust = { version = "latest", mr_boxington = true }
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:anthropics/claude-code" = "latest"
"aqua:earendil-works/pi" = "latest"
"aqua:neovim/neovim" = "latest"
"aqua:openai/codex" = "latest"
"aqua:restic/restic" = "latest"
"aqua:sharkdp/fd" = "latest"
"forgejo:rasterstate/fj" = { version = "latest", api_url = "https://rasterhub.com/api/v1", strip_components = 1 }
"github:twpayne/chezmoi" = "latest"

# Herdr Core publishes separately from the herdr multiplexer.
[tools."http:herdr-core"]
version = "latest"
version_list_url = "https://releases.herdr.dev/core/latest.json"
version_json_path = ".version"
checksum_url = "https://releases.herdr.dev/core/{{ version }}/manifest.json"
checksum_expr = '"sha256:" + fromJSON(body).targets["linux-x86_64"].sha256'
rename_exe = "hc"

[tools."http:herdr-core".platforms.linux-x64]
url = "https://releases.herdr.dev/core/{{ version }}/herdr-core-linux-x86_64.tar.gz"
